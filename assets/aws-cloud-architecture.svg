<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated AWS cloud architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#10281f"/>
      <stop offset="1" stop-color="#0b3b2a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #bbf7d0; }
      .label { font: 700 14px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 600 12px Arial, sans-serif; fill: #bbf7d0; }
      .node { fill: rgba(15, 23, 42, .82); stroke: #22c55e; stroke-width: 2; }
      .node2 { fill: rgba(15, 23, 42, .82); stroke: #f59e0b; stroke-width: 2; }
      .line { stroke: #86efac; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 12; animation: dash 2.8s linear infinite; opacity: .85; }
      .line2 { stroke: #f59e0b; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 12; animation: dash 3.4s linear infinite; opacity: .85; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .float { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 5s ease-in-out infinite reverse; }
      .scan { animation: scan 3.8s ease-in-out infinite; opacity: .7; }
      @keyframes dash { to { stroke-dashoffset: -80; } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes scan { 0% { transform: translateX(-180px); opacity: 0; } 30%,70% { opacity: .55; } 100% { transform: translateX(180px); opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="760" cy="80" r="110" fill="#22c55e" opacity=".08"/>
  <circle cx="150" cy="330" r="140" fill="#f59e0b" opacity=".06"/>

  <g class="scan">
    <rect x="360" y="0" width="90" height="420" fill="#bbf7d0" opacity=".08"/>
  </g>

  <text x="450" y="58" text-anchor="middle" class="title">AWS Cloud Architecture</text>
  <text x="450" y="84" text-anchor="middle" class="subtitle">secure by design . scalable by default . cost-aware in practice</text>

  <path class="line" d="M135 210 C210 160 250 160 315 210"/>
  <path class="line" d="M390 210 C450 155 505 155 570 210"/>
  <path class="line2" d="M645 210 C705 160 755 160 810 210"/>
  <path class="line" d="M450 250 C450 300 390 315 335 330"/>
  <path class="line2" d="M450 250 C450 300 515 315 575 330"/>

  <g class="float">
    <rect x="56" y="162" width="150" height="96" rx="24" class="node"/>
    <circle cx="95" cy="198" r="17" fill="url(#green)" filter="url(#glow)"/>
    <path d="M91 198h8M95 194v8" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <text x="131" y="199" class="label">Users</text>
    <text x="131" y="221" class="small">global access</text>
  </g>

  <g class="float2">
    <rect x="300" y="162" width="150" height="96" rx="24" class="node2"/>
    <path d="M342 211c0-18 14-32 33-32s33 14 33 32-14 32-33 32-33-14-33-32z" fill="url(#orange)" opacity=".95" filter="url(#glow)"/>
    <path d="M357 213h36M375 195v36" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <text x="375" y="286" text-anchor="middle" class="small">Route 53 . CloudFront . ALB</text>
    <text x="375" y="149" text-anchor="middle" class="label">Edge Layer</text>
  </g>

  <g class="pulse">
    <rect x="544" y="154" width="190" height="112" rx="28" class="node"/>
    <rect x="580" y="188" width="42" height="42" rx="10" fill="url(#green)" filter="url(#glow)"/>
    <rect x="636" y="188" width="42" height="42" rx="10" fill="url(#green)" opacity=".72"/>
    <text x="639" y="147" text-anchor="middle" class="label">Compute Layer</text>
    <text x="639" y="288" text-anchor="middle" class="small">ECS . EKS . Lambda</text>
  </g>

  <g class="float">
    <rect x="250" y="306" width="170" height="74" rx="22" class="node"/>
    <path d="M300 334c0-9 16-16 35-16s35 7 35 16v22c0 9-16 16-35 16s-35-7-35-16v-22z" fill="url(#green)" opacity=".92"/>
    <path d="M300 334c0 9 16 16 35 16s35-7 35-16" stroke="#0f172a" stroke-width="3" opacity=".55"/>
    <text x="335" y="402" text-anchor="middle" class="small">RDS . DynamoDB</text>
  </g>

  <g class="float2">
    <rect x="500" y="306" width="170" height="74" rx="22" class="node2"/>
    <path d="M553 325h64l10 18-10 18h-64l-10-18 10-18z" fill="url(#orange)" opacity=".95"/>
    <text x="585" y="402" text-anchor="middle" class="small">S3 . Backup . Logs</text>
  </g>

  <g class="pulse">
    <circle cx="810" cy="210" r="45" fill="rgba(34,197,94,.09)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="810" cy="210" r="28" fill="rgba(245,158,11,.12)" stroke="#f59e0b" stroke-width="2"/>
    <path d="M810 187l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2 7-15z" fill="url(#orange)" filter="url(#glow)"/>
    <text x="810" y="282" text-anchor="middle" class="small">Well-Architected</text>
  </g>
</svg>
