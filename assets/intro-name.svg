<svg width="760" height="92" viewBox="0 0 760 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi there, I'm DucQuan">
  <defs>
    <linearGradient id="name" x1="160" y1="0" x2="600" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .hello { font: 700 40px "Fira Code", "Consolas", monospace; fill: url(#name); }
      .spark { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .hand { animation: wave 1.8s ease-in-out infinite; transform-origin: 665px 43px; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(12deg); } 50% { transform: rotate(-8deg); } 75% { transform: rotate(10deg); } }
    </style>
  </defs>
  <rect width="760" height="92" fill="transparent"/>
  <g filter="url(#soft)">
    <text x="380" y="58" text-anchor="middle" class="hello">Hi there, I'm DucQuan</text>
  </g>
  <g class="hand">
    <circle cx="670" cy="43" r="19" fill="#f59e0b" opacity=".18"/>
    <path d="M658 50c-4-8-5-16-2-18 2-2 5 2 7 7v-16c0-3 4-3 5 0l1 15 2-13c1-3 5-2 5 1l-1 15 4-9c1-3 5-1 5 2l-3 13c-2 10-8 17-15 17-4 0-7-4-8-14z" fill="#f59e0b"/>
    <path d="M646 37c5-10 14-17 25-18" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" class="spark"/>
    <path d="M649 45c5-5 11-8 18-9" stroke="#22c55e" stroke-width="3" stroke-linecap="round" class="spark"/>
  </g>
</svg>
