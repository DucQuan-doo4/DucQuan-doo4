<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated cute cloud">
  <defs>
    <linearGradient id="cloudBlue" x1="300" y1="110" x2="620" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8be8f2"/>
      <stop offset="0.58" stop-color="#6fd6e7"/>
      <stop offset="1" stop-color="#50bdd7"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #166534; }
      .subtitle { font: 500 15px Arial, sans-serif; fill: #64748b; }
      .float { animation: float 5.4s ease-in-out infinite; transform-origin: center; }
      .drift { animation: drift 13s linear infinite; }
      .drift2 { animation: drift2 16s linear infinite; }
      .spark { animation: sparkle 2.8s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 4.2s ease-in-out infinite; transform-origin: center; }
      .path { stroke: #22c55e; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 16; animation: dash 3.4s linear infinite; opacity: .45; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes drift { 0% { transform: translateX(-180px); opacity: 0; } 15%,80% { opacity: .65; } 100% { transform: translateX(900px); opacity: 0; } }
      @keyframes drift2 { 0% { transform: translateX(900px); opacity: 0; } 15%,80% { opacity: .45; } 100% { transform: translateX(-220px); opacity: 0; } }
      @keyframes sparkle { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.18); } }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: .95; transform: scale(1.08); } }
      @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(.12); } }
      @keyframes dash { to { stroke-dashoffset: -96; } }
    </style>
  </defs>

  <rect width="900" height="420" rx="34" fill="#ffffff"/>

  <g class="spark">
    <circle cx="132" cy="96" r="4" fill="#22c55e"/>
    <circle cx="205" cy="145" r="3" fill="#f59e0b"/>
    <circle cx="655" cy="70" r="3.5" fill="#22c55e"/>
    <circle cx="780" cy="178" r="3" fill="#38bdf8"/>
    <circle cx="470" cy="92" r="2.8" fill="#f59e0b"/>
  </g>

  <g class="drift">
    <path d="M42 116c0-13 11-24 25-24 6 0 11 2 16 5 7-12 20-19 35-19 20 0 36 15 39 34 15 1 27 13 27 29 0 16-13 29-29 29H69c-24 0-43-19-43-42 0-5 1-9 3-12h13z" fill="#dff8ff" stroke="#0f172a" stroke-width="3" opacity=".55"/>
    <circle cx="91" cy="126" r="3.5" fill="#0f172a" opacity=".75"/>
    <circle cx="125" cy="126" r="3.5" fill="#0f172a" opacity=".75"/>
    <path d="M101 139c8 7 16 7 24 0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" opacity=".65"/>
  </g>

  <g class="drift2">
    <path d="M64 190c0-11 10-21 22-21 5 0 10 2 14 5 6-10 17-16 30-16 17 0 31 13 34 29 13 2 23 12 23 26 0 14-12 26-26 26H87c-21 0-37-17-37-37 0-4 1-8 2-12h12z" fill="#eefcff" stroke="#0f172a" stroke-width="3" opacity=".35"/>
  </g>

  <g class="float" filter="url(#shadow)">
    <path d="M282 235c-36 0-66-28-66-62 0-32 26-59 59-62 8-47 48-82 97-82 33 0 62 16 80 41 18-13 40-21 64-21 57 0 104 43 110 99 33 7 58 35 58 69 0 39-33 71-74 71H288c-2 0-4 0-6-.1V235z" fill="#0f172a" opacity=".16"/>
    <path d="M282 225c-36 0-66-28-66-62 0-32 26-59 59-62 8-47 48-82 97-82 33 0 62 16 80 41 18-13 40-21 64-21 57 0 104 43 110 99 33 7 58 35 58 69 0 39-33 71-74 71H288c-2 0-4 0-6-.1V225z" fill="url(#cloudBlue)" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M252 179c8 20 28 34 52 34 18 0 34-8 44-20 13 21 37 35 64 35 24 0 45-10 59-27 13 15 33 25 55 25 29 0 54-17 65-42" stroke="#37b6d0" stroke-width="7" stroke-linecap="round" opacity=".38"/>
    <ellipse cx="357" cy="151" rx="9" ry="13" fill="#0f172a" class="blink"/>
    <ellipse cx="525" cy="151" rx="9" ry="13" fill="#0f172a" class="blink"/>
    <circle cx="364" cy="145" r="3" fill="#ffffff"/>
    <circle cx="532" cy="145" r="3" fill="#ffffff"/>
    <circle cx="334" cy="172" r="15" fill="#fca5a5" opacity=".55"/>
    <circle cx="548" cy="172" r="15" fill="#fca5a5" opacity=".55"/>
    <path d="M405 178c24 22 58 22 82 0" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M280 326c104 31 236 31 340 0" class="path"/>

  <text x="450" y="344" text-anchor="middle" class="title">Building in the Cloud</text>
  <text x="450" y="371" text-anchor="middle" class="subtitle">simple . reliable . ready to grow</text>

  <g class="pulse">
    <circle cx="260" cy="326" r="7" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="640" cy="326" r="7" fill="#f59e0b" filter="url(#glow)"/>
  </g>

  <path d="M0 385c130-22 250-21 382-5 155 19 300 7 518-18v58H0v-35z" fill="url(#softGreen)" opacity=".12"/>
</svg>
