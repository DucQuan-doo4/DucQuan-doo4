<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated cloud scene">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="cloud" x1="250" y1="130" x2="660" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16a34a" flood-opacity=".14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #166534; }
      .subtitle { font: 500 15px Arial, sans-serif; fill: #475569; }
      .float { animation: float 5.4s ease-in-out infinite; transform-origin: center; }
      .drift { animation: drift 13s linear infinite; }
      .drift2 { animation: drift2 16s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .spark { animation: sparkle 2.8s ease-in-out infinite; }
      .path { stroke: #22c55e; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 16; animation: dash 3.4s linear infinite; opacity: .62; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes drift { 0% { transform: translateX(-180px); opacity: 0; } 15%,80% { opacity: .85; } 100% { transform: translateX(900px); opacity: 0; } }
      @keyframes drift2 { 0% { transform: translateX(900px); opacity: 0; } 15%,80% { opacity: .6; } 100% { transform: translateX(-220px); opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes sparkle { 0%,100% { opacity: .25; } 50% { opacity: .95; } }
      @keyframes dash { to { stroke-dashoffset: -96; } }
    </style>
  </defs>

  <rect width="900" height="420" rx="34" fill="url(#sky)"/>
  <circle cx="734" cy="92" r="74" fill="url(#sun)" opacity=".14" filter="url(#glow)"/>
  <circle cx="734" cy="92" r="34" fill="url(#sun)" opacity=".8"/>

  <g class="spark" opacity=".55">
    <circle cx="126" cy="92" r="3" fill="#22c55e"/>
    <circle cx="188" cy="136" r="2" fill="#f59e0b"/>
    <circle cx="642" cy="62" r="2.5" fill="#22c55e"/>
    <circle cx="778" cy="178" r="2" fill="#16a34a"/>
    <circle cx="475" cy="94" r="2" fill="#f59e0b"/>
  </g>

  <g class="drift">
    <path d="M42 115c0-14 12-25 27-25 6 0 12 2 17 6 7-12 20-20 36-20 21 0 38 15 41 35 16 1 29 14 29 30 0 17-14 31-31 31H70c-25 0-45-20-45-44 0-5 1-9 3-13h14z" fill="#ffffff" opacity=".72"/>
  </g>

  <g class="drift2">
    <path d="M64 185c0-12 10-22 23-22 6 0 11 2 15 5 6-10 18-17 31-17 18 0 33 14 36 31 14 2 24 13 24 27 0 15-12 27-27 27H87c-22 0-39-17-39-39 0-4 1-8 2-12h14z" fill="#ffffff" opacity=".5"/>
  </g>

  <g class="float" filter="url(#shadow)">
    <path d="M244 238c0-46 38-84 86-84 19 0 37 6 51 17 21-40 63-66 111-66 65 0 119 49 127 112 41 5 73 40 73 82 0 46-37 83-83 83H325c-61 0-111-49-111-110 0-12 2-24 6-34h24z" fill="url(#cloud)"/>
    <path d="M286 246c0-34 28-61 63-61 15 0 28 5 39 13 16-28 46-47 81-47 48 0 88 36 94 82 30 4 53 29 53 60 0 34-27 61-61 61H348c-45 0-81-36-81-80 0-10 2-19 5-28h14z" fill="#ffffff" opacity=".72"/>
    <path d="M308 277c55-33 112-33 171 0 46 26 90 25 134-2" class="path"/>
    <text x="450" y="245" text-anchor="middle" class="title">Building in the Cloud</text>
    <text x="450" y="273" text-anchor="middle" class="subtitle">simple . reliable . ready to grow</text>
  </g>

  <g class="pulse">
    <circle cx="272" cy="332" r="8" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="632" cy="332" r="8" fill="#f59e0b" filter="url(#glow)"/>
    <path d="M288 332c104 31 231 31 328 0" stroke="#16a34a" stroke-width="3" stroke-linecap="round" opacity=".22"/>
  </g>

  <path d="M0 350c96-24 178-26 274-8 128 24 252 8 360-16 103-23 187-13 266 12v82H0v-70z" fill="#22c55e" opacity=".14"/>
  <path d="M0 378c128-24 250-23 382-5 155 21 300 7 518-20v67H0v-42z" fill="#f59e0b" opacity=".16"/>
</svg>
