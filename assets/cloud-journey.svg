<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated cloud journey">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#123326"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px Arial, sans-serif; fill: #bbf7d0; }
      .soft { animation: float 5s ease-in-out infinite; }
      .soft2 { animation: float 6.5s ease-in-out infinite reverse; }
      .drift { animation: drift 11s linear infinite; }
      .drift2 { animation: drift2 14s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .path { stroke: #86efac; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 16; animation: dash 3.5s linear infinite; opacity: .7; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes drift { 0% { transform: translateX(-170px); opacity: 0; } 15%,80% { opacity: .9; } 100% { transform: translateX(900px); opacity: 0; } }
      @keyframes drift2 { 0% { transform: translateX(900px); opacity: 0; } 15%,80% { opacity: .55; } 100% { transform: translateX(-210px); opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes dash { to { stroke-dashoffset: -96; } }
    </style>
  </defs>

  <rect width="900" height="420" rx="34" fill="url(#sky)"/>
  <circle cx="734" cy="92" r="74" fill="url(#warm)" opacity=".18" filter="url(#glow)"/>
  <circle cx="734" cy="92" r="34" fill="url(#warm)" opacity=".88"/>

  <g opacity=".18">
    <circle cx="140" cy="85" r="3" fill="#dcfce7"/>
    <circle cx="200" cy="132" r="2" fill="#dcfce7"/>
    <circle cx="640" cy="64" r="2.5" fill="#dcfce7"/>
    <circle cx="785" cy="176" r="2" fill="#dcfce7"/>
    <circle cx="470" cy="96" r="2" fill="#dcfce7"/>
  </g>

  <g class="drift">
    <ellipse cx="86" cy="106" rx="44" ry="20" fill="#dcfce7" opacity=".72"/>
    <ellipse cx="124" cy="103" rx="36" ry="24" fill="#bbf7d0" opacity=".82"/>
    <ellipse cx="160" cy="109" rx="48" ry="19" fill="#dcfce7" opacity=".68"/>
  </g>

  <g class="drift2">
    <ellipse cx="86" cy="168" rx="40" ry="18" fill="#bbf7d0" opacity=".38"/>
    <ellipse cx="120" cy="164" rx="34" ry="23" fill="#dcfce7" opacity=".42"/>
    <ellipse cx="152" cy="170" rx="44" ry="17" fill="#bbf7d0" opacity=".36"/>
  </g>

  <g class="soft">
    <path d="M278 216c0-35 29-63 65-63 15 0 29 5 40 14 16-30 48-50 84-50 49 0 90 37 96 84 31 4 55 30 55 62 0 35-28 63-63 63H334c-46 0-84-37-84-83 0-9 2-18 5-27h23z" fill="rgba(220,252,231,.1)" stroke="#86efac" stroke-width="2.5"/>
    <path d="M318 248c50-42 106-42 167 0 40 28 82 28 126 0" class="path"/>
    <text x="450" y="223" text-anchor="middle" class="title">Building in the Cloud</text>
    <text x="450" y="251" text-anchor="middle" class="subtitle">simple . reliable . ready to grow</text>
  </g>

  <g class="pulse">
    <circle cx="242" cy="308" r="9" fill="url(#mint)" filter="url(#glow)"/>
    <circle cx="658" cy="308" r="9" fill="url(#warm)" filter="url(#glow)"/>
    <path d="M257 309c110 42 273 42 386 0" stroke="#22c55e" stroke-width="3" stroke-linecap="round" opacity=".38"/>
  </g>

  <path d="M0 340c94-26 178-28 272-9 129 26 252 8 360-18 103-25 187-14 268 14v93H0v-80z" fill="#22c55e" opacity=".22"/>
  <path d="M0 365c112-35 207-33 330-12 116 20 222 19 339-9 86-21 158-18 231 4v72H0v-55z" fill="#bbf7d0" opacity=".28"/>
  <path d="M0 388c149-24 283-22 407-4 147 22 281 10 493-22v58H0v-32z" fill="url(#warm)" opacity=".42"/>
</svg>
